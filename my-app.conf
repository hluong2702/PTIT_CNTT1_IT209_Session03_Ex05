server {
    listen 80;
    server_name _;

    # Thư mục gốc chứa mã nguồn website tĩnh tại phân vùng /opt/
    root /opt/my-app/html;
    index index.html index.htm;

    # Cấu hình lưu trữ logs riêng biệt cho dự án tại /opt/my-app/logs/
    access_log /opt/my-app/logs/access.log;
    error_log /opt/my-app/logs/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    # Trang thông báo lỗi tùy biến (tùy chọn)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
